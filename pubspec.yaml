name: flutter_quill
description: A rich text editor built for the modern Android, iOS, web and desktop platforms. It is the WYSIWYG editor and a Quill component for Flutter.
version: 7.4.1
homepage: https://1o24bbs.com/c/bulletjournal/108
repository: https://github.com/singerdmx/flutter-quill

environment:
  sdk: ">=2.17.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  collection: ^1.17.2
  flutter_colorpicker: ^1.0.3
  flutter_keyboard_visibility: ^6.0.0
  quiver: ^3.2.1
  url_launcher: ^6.1.12
  pedantic: ^1.11.1
  characters: ^1.3.0
  diff_match_patch: ^0.4.1
  i18n_extension: ^10.0.1
  device_info_plus: ^9.1.2
  platform: ^3.1.0
  pasteboard: ^0.2.0
  flutter_svg: 2.0.17
  flutter_regex: ^0.0.3
  # Dependencies for testing utilities
  flutter_test:
    sdk: flutter

dev_dependencies:
  build_runner:
  flutter_gen_runner:

flutter:
  assets:
    - assets/

flutter_gen:
  output: lib/gen/
  assets:
    outputs:
      package_parameter_enabled: true
      class_name: QuillAssets
